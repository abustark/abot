name: CI

on:
  push:
    branches: [main, arena/01a03fe9-abot]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: jsdom now depends on undici, whose CacheStorage uses
      # webidl.util.markAsUncloneable — added in Node 22. On Node 20 every jsdom
      # suite crashes at import ("markAsUncloneable is not a function") even
      # though it passes locally, where Node 22 is installed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun is the documented package manager (AGENTS.md §0); package-lock.json
      # stays the committed lockfile, so `bun install` consumes it.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Syntax check (all JS)
        run: bun run check

      - name: Build CSS
        run: bun run build:css

      - name: Verify dist/output.css is committed and fresh
        run: |
          if ! git diff --exit-code --quiet dist/output.css; then
            echo "::error::dist/output.css is stale — run 'npm run build:css' and commit the result."
            git diff --stat -- dist/output.css
            exit 1
          fi

      - name: jsdom suites (security · smoke · interaction · cycle)
        run: node tools/test-runner.js
